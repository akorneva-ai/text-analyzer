<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Анализатор текста</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f2f2f2;
            border-radius: 5px;
            white-space: pre-wrap;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <h1>Анализатор текста</h1>

    <p>Введите текст для анализа:</p>

    <textarea
        id="textInput"
        placeholder="Введите текст здесь..."
    ></textarea>

    <br>

    <button onclick="analyzeText()">
        Проанализировать
    </button>

    <div id="result">
        Здесь будет результат...
    </div>


    <script>

        async function analyzeText() {

            const text = document.getElementById("textInput").value;
            const resultElement = document.getElementById("result");

            if (!text.trim()) {
                resultElement.innerHTML =
                    '<span class="error">Please enter some text.</span>';
                return;
            }

            resultElement.textContent = "Analyzing...";

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/analyze",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            text: text
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail || "Request failed"
                    );
                }

                resultElement.textContent =
                    `Language: ${data.language}
    Flesch index: ${data.flesch_index}
    Interpretation: ${data.interpretation}
    Polarity: ${data.polarity}
    Subjectivity: ${data.subjectivity}

    Statistics:
    Sentences: ${data.stats.sentence_count}
    Words: ${data.stats.word_count}
    Syllables: ${data.stats.syllable_count}
    Average sentence length: ${data.stats.avg_sentence_length}
    Average word syllables: ${data.stats.avg_word_syllables}`;

            } catch (error) {

                resultElement.innerHTML =
                    `<span class="error">
                        Error: ${error.message}
                    </span>`;
            }
        }

    </script>

</body>
</html>
